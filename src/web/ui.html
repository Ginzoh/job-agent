<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>job-agent</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2129; --line:#30363d;
    --fg:#e6edf3; --dim:#8b949e; --accent:#2f81f7;
    --green:#3fb950; --yellow:#d29922; --red:#f85149; --purple:#a371f7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
  header{position:sticky;top:0;z-index:10;background:rgba(13,17,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 20px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.2px}
  h1 span{color:var(--dim);font-weight:400}
  .grow{flex:1}
  input,select,button{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:6px 10px}
  input:focus,select:focus{outline:1px solid var(--accent);border-color:var(--accent)}
  button{cursor:pointer;transition:.12s}
  button:hover{background:var(--panel2);border-color:#4b5563}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:hover{filter:brightness(1.12)}
  button:disabled{opacity:.5;cursor:not-allowed}
  main{padding:18px 20px 60px;max-width:1180px;margin:0 auto}
  .stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--dim);font-size:12.5px;margin-bottom:16px}
  .stats b{color:var(--fg);font-variant-numeric:tabular-nums}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;transition:.12s}
  .card:hover{border-color:#4b5563}
  .card.open{border-color:var(--accent)}
  .top{display:flex;gap:12px;align-items:flex-start}
  .score{flex:none;width:46px;height:46px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
  .s80{background:rgba(63,185,80,.16);color:var(--green)}
  .s60{background:rgba(47,129,247,.16);color:var(--accent)}
  .s40{background:rgba(210,153,34,.16);color:var(--yellow)}
  .s0 {background:rgba(248,81,73,.14);color:var(--red)}
  .title{font-weight:600;font-size:15px;margin:0 0 3px}
  .title a{color:var(--fg);text-decoration:none}
  .title a:hover{color:var(--accent);text-decoration:underline}
  .meta{color:var(--dim);font-size:12.5px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .meta .sep{opacity:.4}
  .summary{margin:9px 0 0;color:#c9d1d9;font-size:13.5px}
  .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
  .tag{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:20px;padding:1px 9px;font-size:11.5px}
  .badge{border-radius:5px;padding:1px 7px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  .b-remote{background:rgba(163,113,247,.16);color:var(--purple)}
  .b-freelance{background:rgba(210,153,34,.16);color:var(--yellow)}
  .b-permanent{background:rgba(63,185,80,.14);color:var(--green)}
  .b-shortlisted{background:rgba(47,129,247,.18);color:var(--accent)}
  .b-applied{background:rgba(63,185,80,.18);color:var(--green)}
  .b-rejected{background:rgba(248,81,73,.14);color:var(--red)}

  .detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .card.open .detail{display:block}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:700px){.cols{grid-template-columns:1fr}}
  .cols h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}
  .cols ul{margin:0;padding-left:18px}
  .cols li{margin-bottom:3px}
  .pitch{margin-top:12px;background:var(--panel2);border-left:3px solid var(--accent);border-radius:0 7px 7px 0;padding:10px 13px;font-size:13.5px}
  .pitch h4{margin:0 0 5px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent)}
  .desc{margin-top:12px;max-height:280px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:11px;white-space:pre-wrap;font-size:12.5px;color:#adbac7}
  .actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
  .empty{text-align:center;color:var(--dim);padding:60px 20px}
  .empty code{background:var(--panel);padding:2px 7px;border-radius:5px;color:var(--fg)}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:10px 18px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:80vw;text-align:center}
  .toast.show{opacity:1}

  /* --- document generation --- */
  .gen{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .gen button{border-color:#3d4c63}
  .gen button:hover{border-color:var(--accent);color:var(--accent)}
  .opts{display:none;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px;background:var(--panel2);padding:9px 11px;border-radius:8px}
  .opts.show{display:flex}
  .opts label{font-size:12px;color:var(--dim);display:flex;gap:5px;align-items:center}
  .opts input[type=number]{width:78px}
  .opts input[type=text]{flex:1;min-width:170px}

  /* --- modal --- */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;z-index:50;padding:24px;overflow:auto}
  .modal.show{display:block}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:900px;margin:0 auto;box-shadow:0 24px 70px rgba(0,0,0,.6)}
  .sheet header{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;align-items:center;border-radius:12px 12px 0 0;flex-wrap:wrap}
  .sheet h3{margin:0;font-size:15px;flex:1;min-width:180px}
  .sheet .body{padding:18px 22px}
  .doc{white-space:pre-wrap;font:13.5px/1.65 ui-monospace,"Cascadia Code",Consolas,monospace;color:#d7dee6}
  .doc h1,.doc h2,.doc h3{font-family:system-ui,sans-serif}
  .working{padding:44px;text-align:center;color:var(--dim)}
  .working .spin{width:22px;height:22px;border-width:3px;display:block;margin:0 auto 14px}

  /* --- import panel --- */
  .import{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
  .import summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px}
  .import summary::-webkit-details-marker{display:none}
  .import summary::before{content:'+';color:var(--accent);font-weight:700}
  .import[open] summary::before{content:'−'}
  .import .inner{margin-top:12px;display:flex;flex-direction:column;gap:9px}
  .import textarea{width:100%;min-height:120px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:10px;font:13px/1.5 ui-monospace,Consolas,monospace;resize:vertical}
  .import .hint{color:var(--dim);font-size:12.5px}
  .spin{display:inline-block;width:11px;height:11px;border:2px solid var(--dim);border-top-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-1px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <div class="row">
    <h1>job&#8209;agent <span id="hcount"></span></h1>
    <div class="grow"></div>
    <input id="q" placeholder="Search title, company, text…" style="width:220px">
    <select id="status" title="Which pile to show">
      <optgroup label="Still to do">
        <option value="">Not applied yet</option>
        <option value="shortlisted">★ Shortlisted</option>
        <option value="new">Unreviewed</option>
        <option value="reviewed">Reviewed</option>
      </optgroup>
      <optgroup label="Already handled">
        <option value="applied">✔ Applied</option>
        <option value="rejected">Not interested</option>
        <option value="archived">Archived</option>
        <option value="decided">Anything I've decided on</option>
      </optgroup>
      <optgroup label="Everything">
        <option value="active">Open + applied</option>
        <option value="all">Absolutely everything</option>
      </optgroup>
    </select>
    <select id="minScore">
      <option value="">Any score</option>
      <option value="80">80+</option>
      <option value="70" selected>70+</option>
      <option value="60">60+</option>
      <option value="40">40+</option>
    </select>
    <select id="contract">
      <option value="">Any contract</option>
      <option value="freelance">Freelance</option>
      <option value="permanent">Permanent</option>
      <option value="contract">Fixed-term</option>
    </select>
    <select id="order">
      <option value="score">By score</option>
      <option value="date">By date posted</option>
      <option value="seen">Recently found</option>
    </select>
    <label class="meta" style="gap:5px"><input type="checkbox" id="remote" style="width:auto"> Remote</label>
    <button id="run" class="primary">Run now</button>
  </div>
  <div class="stats" id="stats"></div>
</header>

<main>
  <details class="import" id="importPanel">
    <summary>Add an offer you found somewhere else</summary>
    <div class="inner">
      <div class="row">
        <input id="impUrl" placeholder="Paste a job posting URL…" class="grow">
        <button id="impUrlGo" class="primary">Fetch</button>
      </div>
      <div class="hint">Works on most job boards. LinkedIn and Indeed block automated fetching — for those, copy the posting text and paste it below instead.</div>
      <textarea id="impText" placeholder="…or paste the whole job posting here. First line is treated as the title (&quot;Frontend Developer at Acme&quot; is understood)."></textarea>
      <div class="row">
        <input id="impTitle" placeholder="Title (optional override)" style="flex:1">
        <input id="impCompany" placeholder="Company (optional)" style="flex:1">
        <button id="impTextGo" class="primary">Add posting</button>
      </div>
    </div>
  </details>
  <div id="list"></div>
</main>

<div class="modal" id="modal">
  <div class="sheet">
    <header>
      <h3 id="modalTitle">…</h3>
      <span id="modalMeta" class="meta"></span>
      <button id="modalCopy">Copy</button>
      <button id="modalDownload">Download .md</button>
      <button id="modalClose">Close</button>
    </header>
    <div class="body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let jobs = [];
let openId = null;

const scoreClass = (n) => n >= 80 ? 's80' : n >= 60 ? 's60' : n >= 40 ? 's40' : 's0';

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2600);
}

function daysAgo(iso) {
  if (!iso) return null;
  const d = Math.floor((Date.now() - new Date(iso).getTime()) / 864e5);
  return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + 'd ago';
}

async function load() {
  const p = new URLSearchParams();
  const map = { status:'status', minScore:'minScore', contract:'contract', order:'order' };
  for (const [el, key] of Object.entries(map)) {
    const v = $('#' + el).value;
    if (v) p.set(key, v);
  }
  if ($('#q').value.trim()) p.set('q', $('#q').value.trim());
  if ($('#remote').checked) p.set('remote', '1');
  p.set('limit', '120');

  const r = await fetch('/api/jobs?' + p);
  if (r.status === 401) return location.reload();
  jobs = (await r.json()).jobs;
  render();
  loadStats();
}

async function loadStats() {
  const s = await (await fetch('/api/stats')).json();
  $('#stats').innerHTML = [
    ['tracked', s.total], ['relevant', s.total - s.filtered], ['shortlisted', s.shortlisted],
    ['applied', s.applied], ['new this week', s.last7], ['unscored', s.unscored],
  ].map(([k, v]) => `${k} <b>${v}</b>`).join('<span class="sep">·</span> ');
  $('#hcount').textContent = jobs.length ? `— ${jobs.length} shown` : '';
}

function render() {
  if (!jobs.length) {
    $('#list').innerHTML = `<div class="empty">
      <p><b>Nothing matches these filters.</b></p>
      <p>Try lowering the score threshold, or hit <b>Run now</b> to fetch fresh listings.</p>
      <p>First time? Run <code>yarn doctor</code> in the terminal to check your setup.</p>
    </div>`;
    return;
  }

  $('#list').innerHTML = jobs.map((j) => {
    const badges = [
      j.is_remote ? '<span class="badge b-remote">remote</span>' : '',
      j.contract && j.contract !== 'unknown' ? `<span class="badge b-${j.contract}">${esc(j.contract)}</span>` : '',
      ['shortlisted','applied','rejected'].includes(j.status) ? `<span class="badge b-${j.status}">${esc(j.status)}</span>` : '',
    ].join('');

    const meta = [
      esc(j.company || 'unknown company'),
      esc(j.location || '—'),
      j.salary ? esc(j.salary) : '',
      daysAgo(j.posted_at || j.first_seen),
      esc(j.source),
    ].filter(Boolean).join(' <span class="sep">·</span> ');

    return `<div class="card ${openId === j.id ? 'open' : ''}" data-id="${j.id}">
      <div class="top">
        <div class="score ${scoreClass(j.score)}">${j.score ?? '?'}</div>
        <div style="flex:1;min-width:0">
          <p class="title"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></p>
          <div class="meta">${meta} ${badges}</div>
          ${j.fit_summary ? `<p class="summary">${esc(j.fit_summary)}</p>` : ''}
          ${j.stack?.length ? `<div class="tags">${j.stack.slice(0, 9).map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
        </div>
        <button class="toggle">${openId === j.id ? 'Less' : 'More'}</button>
      </div>
      <div class="detail">${openId === j.id ? detailHtml(j) : ''}</div>
    </div>`;
  }).join('');
}

function detailHtml(j) {
  const list = (arr, icon) => (arr ?? []).map((x) => `<li>${icon} ${esc(x)}</li>`).join('');
  return `
    <div class="cols">
      <div><h4>In favour</h4><ul>${list(j.pros, '✅') || '<li class="meta">nothing noted</li>'}</ul></div>
      <div><h4>Against</h4><ul>${list(j.cons, '⚠️') || '<li class="meta">nothing noted</li>'}</ul></div>
    </div>
    ${j.pitch ? `<div class="pitch"><h4>Suggested opening line</h4>${esc(j.pitch)}</div>` : ''}
    <div class="desc">${esc(j.fullDescription ?? j.excerpt ?? '')}</div>
    <div class="actions">
      <a href="${esc(j.url)}" target="_blank" rel="noopener"><button class="primary">Open posting ↗</button></a>
      <button data-act="shortlisted">★ Shortlist</button>
      <button data-act="applied">✔ Mark applied</button>
      <button data-act="rejected">✕ Not interested</button>
      <button data-act="archived">Archive</button>
    </div>

    <div class="gen">
      <button data-gen="advice" title="What to change in your CV for this specific role">📝 CV advice</button>
      <button data-gen="cv" title="Generate a tailored version of your CV">📄 Tailor my CV</button>
      <button data-gen="cover" title="Write a cover letter for this role">✉️ Cover letter</button>
      <button data-optstoggle title="Language, length, tone">⚙︎ Options</button>
      <span id="docs-${j.id}" class="meta"></span>
    </div>

    <div class="opts">
      <label>Language
        <select data-opt="language">
          <option value="">auto (match posting)</option>
          <option value="fr">Français</option>
          <option value="en">English</option>
        </select>
      </label>
      <label>Max characters
        <input type="number" data-opt="maxChars" placeholder="2500" min="300" step="100">
      </label>
      <label>Tone
        <select data-opt="tone">
          <option value="professional">Professional</option>
          <option value="warm">Warm</option>
          <option value="direct">Direct</option>
          <option value="enthusiastic">Enthusiastic</option>
        </select>
      </label>
      <input type="text" data-opt="notes" placeholder="Anything else? e.g. 'lead with React Native', 'mention I can start immediately'">
    </div>`;
}

$('#list').addEventListener('click', async (e) => {
  const card = e.target.closest('.card');
  if (!card) return;
  const id = card.dataset.id;

  if (e.target.classList.contains('toggle')) {
    openId = openId === id ? null : id;
    if (openId) {
      const full = await (await fetch('/api/job/' + id)).json();
      const j = jobs.find((x) => x.id === id);
      if (j) j.fullDescription = full.description;
    }
    render();
    if (openId) showExistingDocs(openId);
    return;
  }

  if (e.target.hasAttribute('data-optstoggle')) {
    card.querySelector('.opts')?.classList.toggle('show');
    return;
  }

  const kind = e.target.dataset.gen;
  if (kind) return generate(card, id, kind);

  const act = e.target.dataset.act;
  if (act) {
    await fetch('/api/job/' + id, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ status: act }),
    });
    toast(`Marked as ${act}`);
    openId = null;
    load();
  }
});

const KIND_LABEL = { advice: 'CV advice', cv: 'Tailored CV', cover: 'Cover letter' };

function readOptions(card) {
  const o = {};
  for (const el of card.querySelectorAll('[data-opt]')) {
    const v = el.value.trim();
    if (v) o[el.dataset.opt] = el.dataset.opt === 'maxChars' ? Number(v) : v;
  }
  return o;
}

async function generate(card, id, kind) {
  const job = jobs.find((x) => x.id === id);
  openModal(`${KIND_LABEL[kind]} — ${job ? job.title : ''}`, null);

  try {
    const r = await fetch('/api/tailor', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ jobId: id, kind, options: readOptions(card) }),
    });
    const data = await r.json();
    if (!r.ok) {
      openModal(`${KIND_LABEL[kind]} — couldn't generate`, data.error || 'unknown error');
      return;
    }
    openModal(`${KIND_LABEL[kind]} — ${job ? job.title : ''}`, data.content, `${data.model} · $${(data.cost || 0).toFixed(3)}`);
    showExistingDocs(id);
  } catch (err) {
    openModal(`${KIND_LABEL[kind]} — failed`, String(err));
  }
}

async function showExistingDocs(id) {
  const slot = document.getElementById('docs-' + id);
  if (!slot) return;
  const { documents } = await (await fetch('/api/documents?jobId=' + id)).json();
  if (!documents?.length) { slot.textContent = ''; return; }
  slot.innerHTML = 'saved: ' + documents.map((d) =>
    `<a href="#" data-doc="${d.id}">${KIND_LABEL[d.kind] || d.kind}</a>`
  ).join(' <span class="sep">·</span> ');
}

document.addEventListener('click', async (e) => {
  const docId = e.target.dataset?.doc;
  if (!docId) return;
  e.preventDefault();
  const d = await (await fetch('/api/documents/' + docId)).json();
  openModal(KIND_LABEL[d.kind] || d.kind, d.content, `${d.model} · ${new Date(d.at).toLocaleString()}`);
});

/* ---------------------------------------------------------------- modal */
let modalText = '';
function openModal(title, content, meta) {
  $('#modalTitle').textContent = title;
  // Show the real character count — the model is told to cap the letter *body*,
  // so seeing the true total is the only way to know where you actually landed.
  const count = content ? `${content.length.toLocaleString()} chars` : '';
  $('#modalMeta').textContent = [meta, count].filter(Boolean).join(' · ');
  modalText = content || '';
  $('#modalBody').innerHTML = content === null
    ? `<div class="working"><span class="spin"></span>Writing with ${window.__writeModel || 'Claude'}… this takes 30-90 seconds.</div>`
    : `<div class="doc">${esc(content)}</div>`;
  $('#modal').classList.add('show');
}
$('#modalClose').onclick = () => $('#modal').classList.remove('show');
$('#modal').onclick = (e) => { if (e.target.id === 'modal') $('#modal').classList.remove('show'); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#modal').classList.remove('show'); });
$('#modalCopy').onclick = async () => {
  if (!modalText) return;
  await navigator.clipboard.writeText(modalText);
  toast('Copied to clipboard');
};
$('#modalDownload').onclick = () => {
  if (!modalText) return;
  const blob = new Blob([modalText], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = ($('#modalTitle').textContent.replace(/[^\w -]/g, '').trim() || 'document') + '.md';
  a.click();
  URL.revokeObjectURL(a.href);
};

/* --------------------------------------------------------------- import */
async function doImport(payload, btn) {
  const original = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>';
  try {
    const r = await fetch('/api/import', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload),
    });
    const data = await r.json();
    if (!r.ok) { toast(data.error || 'import failed'); return; }
    toast(data.isNew ? `Added: ${data.job.title}` : 'Already had that one — showing it');
    $('#impUrl').value = ''; $('#impText').value = ''; $('#impTitle').value = ''; $('#impCompany').value = '';
    $('#importPanel').open = false;
    $('#status').value = 'all';
    $('#minScore').value = '';
    $('#q').value = data.job.title.slice(0, 40);
    await load();
    openId = data.job.id;
    const full = await (await fetch('/api/job/' + data.job.id)).json();
    const j = jobs.find((x) => x.id === data.job.id);
    if (j) j.fullDescription = full.description;
    render();
    showExistingDocs(data.job.id);
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}
$('#impUrlGo').onclick = (e) => {
  const url = $('#impUrl').value.trim();
  if (!url) return toast('Paste a URL first');
  doImport({ url }, e.target);
};
$('#impTextGo').onclick = (e) => {
  const text = $('#impText').value.trim();
  if (!text) return toast('Paste the posting text first');
  doImport({ text, title: $('#impTitle').value.trim() || undefined, company: $('#impCompany').value.trim() || undefined }, e.target);
};

/* Warn once if the reference documents aren't readable. */
(async () => {
  try {
    const s = await (await fetch('/api/setup')).json();
    window.__writeModel = s.writeModel;
    if (s.problems?.length) toast('Setup: ' + s.problems[0]);
  } catch {}
})();

$('#run').addEventListener('click', async () => {
  const btn = $('#run');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> Running…';
  const r = await fetch('/api/run', { method: 'POST' });
  if (r.status === 409) { toast('A run is already going'); }
  else { toast('Fetching sources — this takes a minute or two'); }

  const poll = setInterval(async () => {
    const { busy } = await (await fetch('/api/busy')).json();
    if (busy) return;
    clearInterval(poll);
    btn.disabled = false;
    btn.textContent = 'Run now';
    toast('Run finished');
    load();
  }, 3000);
});

let debounce;
for (const el of ['q','status','minScore','contract','order','remote']) {
  $('#' + el).addEventListener(el === 'q' ? 'input' : 'change', () => {
    clearTimeout(debounce);
    debounce = setTimeout(load, el === 'q' ? 300 : 0);
  });
}

load();
</script>
</body>
</html>
